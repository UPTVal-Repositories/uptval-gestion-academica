version: '3.8'

services:
  web:
    build: .
    container_name: uptval_web_app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - uptval_network 

  db:
    image: mysql:9.0
    container_name: uptval_db
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - uptval_network 

networks:
  uptval_network:
    driver: bridge

volumes:
  db_data:
  
